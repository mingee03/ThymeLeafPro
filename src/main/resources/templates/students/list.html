<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학생 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/students}">
            <i class="bi bi-people-fill me-2"></i>학생 관리 시스템
        </a>
    </div>
</nav>

<main class="container my-4">
    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-header bg-white py-3 border-0 d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2">
            <div>
                <h4 class="card-title fw-bold text-dark mb-0">학생 목록</h4>
                <p class="text-muted small mb-0 mt-1">등록된 전체 학생 목록을 확인하고 관리할 수 있습니다.</p>
            </div>
            <div>
                <a th:href="@{/students/new}" class="btn btn-primary d-inline-flex align-items-center">
                    <i class="bi bi-plus-lg me-1"></i>새 학생 등록
                </a>
            </div>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th scope="col" class="text-center" style="width: 80px;">ID</th>
                        <th scope="col">이름</th>
                        <th scope="col">나이</th>
                        <th scope="col">이메일</th>
                        <th scope="col">전공</th>
                        <th scope="col">학번</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${students == null or #lists.isEmpty(students)}">
                        <td colspan="6" class="text-center py-5 text-muted">
                            <i class="bi bi-inbox fs-1 d-block mb-2 text-secondary"></i>
                            등록된 학생이 없습니다. 새 학생을 등록해 보세요.
                        </td>
                    </tr>
                    <tr th:each="student : ${students}">
                        <td class="text-center text-muted fw-semibold" th:text="${student.id}">1</td>
                        <td class="fw-semibold text-dark" th:text="${student.name}">홍길동</td>
                        <td th:text="${student.age}">20</td>
                        <td th:text="${student.email}">student@example.com</td>
                        <td>
                            <span class="badge bg-light text-primary border border-primary-subtle px-2 py-1" th:text="${student.major}">컴퓨터공학</span>
                        </td>
                        <td class="font-monospace text-secondary small" th:text="${student.studentId}">20260001</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
