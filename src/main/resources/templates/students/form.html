<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>새 학생 등록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/students}">
            <i class="bi bi-people-fill me-2"></i>학생 관리 시스템
        </a>
    </div>
</nav>

<main class="container my-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-header bg-white py-3 border-0">
                    <h4 class="card-title fw-bold text-dark mb-0">새 학생 등록</h4>
                    <p class="text-muted small mb-0 mt-1">새로운 학생 정보를 입력하여 등록하세요.</p>
                </div>
                <div class="card-body p-4 pt-2">
                    <form th:action="@{/students}" method="post">
                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold">이름 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" name="name" placeholder="학생 이름을 입력하세요" required>
                        </div>

                        <div class="mb-3">
                            <label for="age" class="form-label fw-semibold">나이 <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="age" name="age" placeholder="나이를 입력하세요" min="0" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">이메일 <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="이메일 주소를 입력하세요" required>
                        </div>

                        <div class="mb-3">
                            <label for="major" class="form-label fw-semibold">전공 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="major" name="major" placeholder="전공을 입력하세요" required>
                        </div>

                        <div class="mb-4">
                            <label for="studentId" class="form-label fw-semibold">학번 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="studentId" name="studentId" placeholder="학번을 입력하세요 (예: 20260001)" required>
                        </div>

                        <div class="d-flex justify-content-end gap-2 pt-2 border-top">
                            <a th:href="@{/students}" class="btn btn-outline-secondary d-inline-flex align-items-center">
                                <i class="bi bi-arrow-left me-1"></i>목록으로 돌아가기
                            </a>
                            <button type="submit" class="btn btn-primary d-inline-flex align-items-center">
                                <i class="bi bi-check-lg me-1"></i>등록
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
